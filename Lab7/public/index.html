<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Notes Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h2>Student Notes Manager</h2>

    <div id="note-form-container">
        <h3 id="form-title">Add Note</h3>
        <input type="hidden" id="note-id">
        <div class="form-group">
            <label>Title:</label>
            <input type="text" id="title" required>
        </div>
        <div class="form-group">
            <label>Subject:</label>
            <input type="text" id="subject" required>
        </div>
        <div class="form-group">
            <label>Description:</label>
            <textarea id="description" rows="3" required></textarea>
        </div>
        <button onclick="saveNote()" id="save-btn">Save Note</button>
        <button onclick="resetForm()" id="cancel-btn" style="display:none;">Cancel Edit</button>
    </div>

    <hr>

    <h3>My Notes</h3>
    <div id="notes-container"></div>

    <script src="app.js"></script>
</body>
</html>
